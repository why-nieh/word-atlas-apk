name: Build offline APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/designfuchen/word-atlas.git

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" 2>/dev/null || true

      - name: Fetch upstream source
        run: |
          git clone --depth 1 "$UPSTREAM" app
          echo "源码体积：$(du -sh app | cut -f1)"

      - name: Install npm deps
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        working-directory: app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Report dist size
        run: |
          echo "dist 体积：$(du -sh app/dist | cut -f1)"
          echo "文件数：$(find app/dist -type f | wc -l)"

      - name: Add Capacitor android platform
        working-directory: app
        run: |
          npm i -D @capacitor/cli@^7 --no-audit --no-fund
          npm i @capacitor/core@^7 @capacitor/android@^7 --no-audit --no-fund
          cp ../capacitor.config.json .
          rm -f dist/sw.js
          npx cap add android

      - name: Patch android project
        run: node scripts/patch-android.mjs app/android

      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/*.apk "out/word-atlas-${{ github.run_number }}.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-atlas-apk
          path: out/*.apk
          compression-level: 0
          retention-days: 30
